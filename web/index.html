<!DOCTYPE html>
<html>
<head>
    <title>Test mapy Polski</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 600px; }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    // 1. Inicjalizacja mapy
    var map = L.map('map').setView([52.0, 19.0], 6);

    // 2. Dodanie tła
    L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 18
    }).addTo(map);

    // 3. Wczytanie GeoJSON Polski
    fetch('poland.geojson')
        .then(response => response.json())
        .then(data => {
            // 4. Dodanie warstwy z regionami
            var geojsonLayer = L.geoJSON(data, {
                style: {
                    color: "blue",
                    weight: 2,
                    fillColor: "lightblue",
                    fillOpacity: 0.5
                },
                onEachFeature: function(feature, layer) {
                    // 5. Wyświetlenie nazwy po kliknięciu
                    layer.bindPopup(feature.properties.name);
                }
            }).addTo(map);

            console.log("GeoJSON załadowany!");
            console.log("Pierwszy region:", data.features[0].properties);
        })
        .catch(error => console.error("Błąd:", error));
</script>
</body>
</html>
