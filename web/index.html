<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstateMap — ceny nieruchomości w Polsce</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0d0f12;
            --surface:   #141720;
            --border:    rgba(255,255,255,0.07);
            --text:      #e8eaf0;
            --muted:     #6b7280;
            --accent:    #4ade80;

            /* skala kolorów mapy: zimny → ciepły */
            --c0: #1e3a5f;
            --c1: #1d6fa4;
            --c2: #2196c8;
            --c3: #27ae8a;
            --c4: #f0c419;
            --c5: #e67e22;
            --c6: #c0392b;
        }

        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

        /* ── LAYOUT ── */
        #app { display: grid; grid-template-rows: 56px 1fr; grid-template-columns: 320px 1fr; height: 100vh; }

        /* ── NAGŁÓWEK ── */
        header {
            grid-column: 1 / -1;
            display: flex; align-items: center; gap: 16px;
            padding: 0 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        header .logo {
            font-family: 'DM Mono', monospace;
            font-size: 15px; font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.05em;
        }
        header .subtitle { font-size: 13px; color: var(--muted); }
        header .spacer { flex: 1; }
        header .badge {
            font-family: 'DM Mono', monospace;
            font-size: 11px; color: var(--muted);
            border: 1px solid var(--border);
            padding: 3px 10px; border-radius: 20px;
        }

        /* ── PANEL BOCZNY ── */
        #sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 20px 16px;
        }

        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-track { background: transparent; }
        #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .panel-title {
            font-family: 'DM Mono', monospace;
            font-size: 10px; font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* Karta wybranego województwa */
        #selected-card {
            background: rgba(74,222,128,0.06);
            border: 1px solid rgba(74,222,128,0.2);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            min-height: 80px;
            transition: all 0.3s ease;
        }
        #selected-card .card-name {
            font-size: 16px; font-weight: 600;
            color: var(--text); margin-bottom: 10px;
            text-transform: capitalize;
        }
        #selected-card .card-empty {
            font-size: 13px; color: var(--muted);
            font-style: italic;
        }
        .stat-row {
            display: flex; justify-content: space-between;
            align-items: baseline;
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { font-size: 12px; color: var(--muted); }
        .stat-value { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text); }
        .stat-value.up   { color: #4ade80; }
        .stat-value.down { color: #f87171; }

        /* Lista miast */
        .cities-list { margin-top: 14px; }
        .city-item {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
        }
        .city-item:last-child { border-bottom: none; }
        .city-rank {
            font-family: 'DM Mono', monospace;
            font-size: 10px; color: var(--muted);
            width: 18px; flex-shrink: 0;
        }
        .city-name { font-size: 13px; flex: 1; color: var(--text); }
        .city-price {
            font-family: 'DM Mono', monospace;
            font-size: 12px; color: var(--accent);
        }
        .city-bar-wrap { width: 60px; height: 3px; background: var(--border); border-radius: 2px; flex-shrink: 0; }
        .city-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s ease; }

        /* Ranking ogólny */
        #ranking { margin-top: 4px; }
        .rank-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 8px; border-radius: 6px;
            cursor: pointer; transition: background 0.15s;
            margin-bottom: 2px;
        }
        .rank-item:hover { background: rgba(255,255,255,0.04); }
        .rank-item.active { background: rgba(74,222,128,0.08); }
        .rank-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); width: 18px; }
        .rank-color { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .rank-name { flex: 1; font-size: 12px; text-transform: capitalize; }
        .rank-val { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

        /* Legenda */
        #legend {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .legend-scale {
            display: flex; height: 8px; border-radius: 4px; overflow: hidden;
            margin: 8px 0 6px;
        }
        .legend-scale div { flex: 1; }
        .legend-labels { display: flex; justify-content: space-between; }
        .legend-labels span { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }

        /* ── MAPA ── */
        #map { z-index: 1; }

        /* Leaflet overrides */
        .leaflet-container { background: var(--bg) !important; }
        .leaflet-control-zoom a {
            background: var(--surface) !important;
            color: var(--text) !important;
            border-color: var(--border) !important;
        }
        .leaflet-control-zoom a:hover { background: rgba(255,255,255,0.08) !important; }
        .leaflet-control-attribution {
            background: rgba(13,15,18,0.8) !important;
            color: var(--muted) !important;
            font-size: 10px !important;
        }
        .leaflet-control-attribution a { color: var(--muted) !important; }

        /* Tooltip mapy */
        .map-tooltip {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .map-tooltip strong { display: block; font-size: 13px; margin-bottom: 4px; text-transform: capitalize; }
        .map-tooltip span { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); }

        /* ── Loading ── */
        #loading {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #loading .load-logo {
            font-family: 'DM Mono', monospace;
            font-size: 22px; color: var(--accent);
            margin-bottom: 16px;
        }
        #loading .load-bar-wrap {
            width: 200px; height: 2px;
            background: var(--border); border-radius: 1px;
        }
        #loading .load-bar {
            height: 100%; background: var(--accent);
            border-radius: 1px;
            animation: loadbar 1.2s ease-in-out infinite;
        }
        @keyframes loadbar {
            0%   { width: 0%; margin-left: 0; }
            50%  { width: 60%; margin-left: 20%; }
            100% { width: 0%; margin-left: 100%; }
        }
        #loading .load-msg {
            font-size: 12px; color: var(--muted);
            margin-top: 12px; font-family: 'DM Mono', monospace;
        }

        /* ── Error ── */
        #error-msg {
            display: none;
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(248,113,113,0.12);
            border: 1px solid rgba(248,113,113,0.3);
            color: #f87171;
            padding: 12px 16px; border-radius: 8px;
            font-size: 13px; z-index: 999;
            max-width: 360px;
        }
    </style>
</head>
<body>

<div id="loading">
    <div class="load-logo">EstateMap</div>
    <div class="load-bar-wrap"><div class="load-bar"></div></div>
    <div class="load-msg">wczytywanie danych...</div>
</div>

<div id="error-msg"></div>

<div id="app">
    <header>
        <div class="logo">EstateMap</div>
        <div class="subtitle">ceny nieruchomości · Polska</div>
        <div class="spacer"></div>
        <div class="badge" id="data-info">ładowanie...</div>
    </header>

    <div id="sidebar">
        <!-- Karta wybranego woj -->
        <div class="panel-title">Wybrane województwo</div>
        <div id="selected-card">
            <div class="card-empty">Kliknij województwo na mapie</div>
        </div>

        <!-- Ranking -->
        <div class="panel-title">Ranking · avg cena/m²</div>
        <div id="ranking"></div>

        <!-- Legenda -->
        <div id="legend">
            <div class="panel-title">Skala cen (zł/m²)</div>
            <div class="legend-scale">
                <div style="background:var(--c0)"></div>
                <div style="background:var(--c1)"></div>
                <div style="background:var(--c2)"></div>
                <div style="background:var(--c3)"></div>
                <div style="background:var(--c4)"></div>
                <div style="background:var(--c5)"></div>
                <div style="background:var(--c6)"></div>
            </div>
            <div class="legend-labels">
                <span id="leg-min">—</span>
                <span id="leg-mid">—</span>
                <span id="leg-max">—</span>
            </div>
        </div>
    </div>

    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ============================================================================
    // EstateMap — map.js (inline)
    // ============================================================================

    const COLORS = ['#1e3a5f','#1d6fa4','#2196c8','#27ae8a','#f0c419','#e67e22','#c0392b'];

    let map, geojsonLayer, data, activeLayer = null;

    // ── Inicjalizacja mapy ──────────────────────────────────────────────────────
    map = L.map('map', {
        center: [52.0, 19.4],
        zoom: 6,
        zoomControl: true,
        attributionControl: true
    });

    // Ciemne kafelki OpenStreetMap (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; OSM contributors',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    // ── Skala kolorów ──────────────────────────────────────────────────────────
    function getColor(val, min, max) {
        const t = Math.max(0, Math.min(1, (val - min) / (max - min)));
        const i = Math.floor(t * (COLORS.length - 1));
        const f = t * (COLORS.length - 1) - i;
        if (i >= COLORS.length - 1) return COLORS[COLORS.length - 1];

        // Interpolacja hex
        const c1 = hexToRgb(COLORS[i]);
        const c2 = hexToRgb(COLORS[i + 1]);
        const r = Math.round(c1.r + f * (c2.r - c1.r));
        const g = Math.round(c1.g + f * (c2.g - c1.g));
        const b = Math.round(c1.b + f * (c2.b - c1.b));
        return `rgb(${r},${g},${b})`;
    }

    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1,3),16);
        const g = parseInt(hex.slice(3,5),16);
        const b = parseInt(hex.slice(5,7),16);
        return {r, g, b};
    }

    // ── Ładowanie danych ────────────────────────────────────────────────────────
    async function init() {
        try {
            const [geoRes, dataRes] = await Promise.all([
                fetch('poland.geojson'),
                fetch('../output/data.json')
            ]);

            if (!geoRes.ok) throw new Error('Nie można wczytać poland.geojson');
            if (!dataRes.ok) throw new Error('Nie można wczytać data.json — uruchom najpierw analysis');

            const geojson = await geoRes.json();
            data = (await dataRes.json()).wojewodztwa;

            renderMap(geojson);
            renderRanking();
            updateLegend();
            updateBadge();
            hideLoading();

        } catch(e) {
            showError(e.message);
            hideLoading();
        }
    }

    // ── Renderowanie mapy ────────────────────────────────────────────────────────
    function renderMap(geojson) {
        const values = Object.values(data).map(d => d.avg_cena_m2);
        const minVal = Math.min(...values);
        const maxVal = Math.max(...values);

        geojsonLayer = L.geoJSON(geojson, {
            style: feature => styleFeature(feature, minVal, maxVal),
            onEachFeature: (feature, layer) => {
                layer.on({
                    mouseover: e => onHover(e, minVal, maxVal),
                    mouseout:  e => onOut(e),
                    click:     e => onClick(e, feature)
                });
            }
        }).addTo(map);

        // Zapisz min/max do legendy
        window._minVal = minVal;
        window._maxVal = maxVal;
    }

    // Mapa HASC_1 → kod TERYT (2 cyfry)
    // Twój GeoJSON używa pola HASC_1 zamiast JPT_KOD_JE
    const HASC_DO_TERYT = {
        'PL.DS': '02', 'PL.KP': '04', 'PL.LU': '06', 'PL.LB': '08',
        'PL.LD': '10', 'PL.MA': '12', 'PL.MZ': '14', 'PL.OP': '16',
        'PL.PK': '18', 'PL.PD': '20', 'PL.PM': '22', 'PL.SL': '24',
        'PL.SK': '26', 'PL.WN': '28', 'PL.WP': '30', 'PL.ZP': '32'
    };

    function getKod(feature) {
        const p = feature.properties;
        // Obsługa JPT_KOD_JE (oficjalny GUGiK) i HASC_1 (ten GeoJSON)
        if (p.JPT_KOD_JE) return p.JPT_KOD_JE.toString().padStart(2, '0').slice(0, 2);
        if (p.HASC_1 && HASC_DO_TERYT[p.HASC_1]) return HASC_DO_TERYT[p.HASC_1];
        if (p.kod)   return p.kod.toString().padStart(2, '0').slice(0, 2);
        if (p.TERYT) return p.TERYT.toString().padStart(2, '0').slice(0, 2);
        return '';
    }

    function styleFeature(feature, minVal, maxVal) {
        const kod = getKod(feature);
        const woj = data[kod];
        const fillColor = woj ? getColor(woj.avg_cena_m2, minVal, maxVal) : '#1a1d23';

        return {
            fillColor,
            fillOpacity: 0.75,
            color: '#0d0f12',
            weight: 1.5
        };
    }

    function onHover(e, minVal, maxVal) {
        const layer = e.target;
        const kod = getKod(layer.feature);
        const woj = data[kod];

        layer.setStyle({
            fillOpacity: 0.92,
            weight: 2.5,
            color: '#4ade80'
        });

        if (woj) {
            layer.bindTooltip(`
      <div class="map-tooltip">
        <strong>${woj.nazwa}</strong>
        <span>${Math.round(woj.avg_cena_m2).toLocaleString('pl-PL')} zł/m²</span>
      </div>
    `, { sticky: true, className: 'leaflet-tooltip-own' }).openTooltip();
        }
    }

    function onOut(e) {
        if (e.target === activeLayer) return;
        geojsonLayer.resetStyle(e.target);
        e.target.closeTooltip();
    }

    function onClick(e, feature) {
        // Resetuj poprzedni aktywny
        if (activeLayer && activeLayer !== e.target) {
            geojsonLayer.resetStyle(activeLayer);
        }
        activeLayer = e.target;

        const kod = getKod(feature);
        const woj = data[kod];
        if (woj) showSelectedCard(kod, woj);

        // Podświetl aktywne w rankingu
        document.querySelectorAll('.rank-item').forEach(el => {
            el.classList.toggle('active', el.dataset.kod === kod);
        });
    }

    // ── Panel boczny — karta województwa ─────────────────────────────────────────
    function showSelectedCard(kod, woj) {
        const trendClass = woj.trend >= 0 ? 'up' : 'down';
        const trendSign  = woj.trend >= 0 ? '+' : '';

        let citiesHtml = '';
        if (woj.miasta && woj.miasta.length > 0) {
            const maxPrice = Math.max(...woj.miasta.map(m => m.avg_cena_m2));
            citiesHtml = `
      <div style="margin-top:14px">
        <div class="panel-title" style="margin-bottom:8px">Top miasta</div>
        <div class="cities-list">
          ${woj.miasta.slice(0, 6).map((m, i) => {
                const pct = maxPrice > 0 ? (m.avg_cena_m2 / maxPrice * 100) : 0;
                return `
              <div class="city-item">
                <span class="city-rank">${i+1}</span>
                <span class="city-name">${m.nazwa}</span>
                <div class="city-bar-wrap"><div class="city-bar" style="width:${pct}%"></div></div>
                <span class="city-price">${Math.round(m.avg_cena_m2).toLocaleString('pl-PL')}</span>
              </div>`;
            }).join('')}
        </div>
      </div>`;
        }

        document.getElementById('selected-card').innerHTML = `
    <div class="card-name">${woj.nazwa}</div>
    <div class="stat-row">
      <span class="stat-label">Średnia cena/m²</span>
      <span class="stat-value">${Math.round(woj.avg_cena_m2).toLocaleString('pl-PL')} zł</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Mediana ceny/m²</span>
      <span class="stat-value">${Math.round(woj.median_cena_m2).toLocaleString('pl-PL')} zł</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Trend r/r</span>
      <span class="stat-value ${trendClass}">${trendSign}${woj.trend.toFixed(1)}%</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Transakcji</span>
      <span class="stat-value">${woj.transakcje.toLocaleString('pl-PL')}</span>
    </div>
    ${citiesHtml}
  `;
    }

    // ── Ranking w sidebarze ───────────────────────────────────────────────────────
    function renderRanking() {
        const values = Object.entries(data).map(([kod, w]) => ({ kod, ...w }));
        values.sort((a, b) => b.avg_cena_m2 - a.avg_cena_m2);
        const min = values[values.length-1].avg_cena_m2;
        const max = values[0].avg_cena_m2;

        document.getElementById('ranking').innerHTML = values.map((w, i) => `
    <div class="rank-item" data-kod="${w.kod}" onclick="selectWoj('${w.kod}')">
      <span class="rank-num">${i+1}</span>
      <span class="rank-color" style="background:${getColor(w.avg_cena_m2, min, max)}"></span>
      <span class="rank-name">${w.nazwa}</span>
      <span class="rank-val">${Math.round(w.avg_cena_m2).toLocaleString('pl-PL')} zł</span>
    </div>
  `).join('');
    }

    // Kliknięcie w ranking → zaznaczenie na mapie
    function selectWoj(kod) {
        geojsonLayer.eachLayer(layer => {
            const k = getKod(layer.feature);
            if (k === kod) {
                if (activeLayer && activeLayer !== layer) geojsonLayer.resetStyle(activeLayer);
                activeLayer = layer;
                layer.setStyle({ fillOpacity: 0.92, weight: 2.5, color: '#4ade80' });
                map.fitBounds(layer.getBounds(), { padding: [40, 40] });
                showSelectedCard(kod, data[kod]);
                document.querySelectorAll('.rank-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.kod === kod);
                });
            }
        });
    }

    // ── Legenda ───────────────────────────────────────────────────────────────────
    function updateLegend() {
        const values = Object.values(data).map(d => d.avg_cena_m2);
        const min = Math.min(...values);
        const max = Math.max(...values);
        const mid = (min + max) / 2;
        document.getElementById('leg-min').textContent = Math.round(min).toLocaleString('pl-PL');
        document.getElementById('leg-mid').textContent = Math.round(mid).toLocaleString('pl-PL');
        document.getElementById('leg-max').textContent = Math.round(max).toLocaleString('pl-PL');
    }

    // ── Badge z info o danych ─────────────────────────────────────────────────────
    function updateBadge() {
        const total = Object.values(data).reduce((s, w) => s + w.transakcje, 0);
        document.getElementById('data-info').textContent =
            `${total.toLocaleString('pl-PL')} transakcji · RCN`;
    }

    // ── Loading / Error ───────────────────────────────────────────────────────────
    function hideLoading() {
        const el = document.getElementById('loading');
        el.style.opacity = '0';
        setTimeout(() => el.style.display = 'none', 500);
    }

    function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = '⚠ ' + msg;
        el.style.display = 'block';
    }

    // ── Start ─────────────────────────────────────────────────────────────────────
    init();
</script>
</body>
</html>
